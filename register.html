
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Registration</title>
    <link rel="stylesheet" href="style.css">

    <base target="_self">
</head>

<body>

    <header>
        <h2>MediCare Hospital</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Patient Registration</h1>
        <p>Register your details to book an appointment</p>
    </section>

    <div class="container">

        <form id="registerForm">

            <label>Patient Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label>Age</label>
            <input
                type="number"
                id="age"
                placeholder="Enter your age"
                min="1"
                max="120"
                required
            >

            <label>Gender</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label>Phone Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
            >

            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter email"
                required
            >

            <button type="submit">Register</button>

        </form>

    </div>

    <script>

        // Registration form

        const registerForm = document.getElementById("registerForm");

        registerForm.addEventListener("submit", function(event) {

            event.preventDefault();

            // Get patient details

            const patientName =
                document.getElementById("name").value.trim();

            const patientAge =
                document.getElementById("age").value;

            const patientGender =
                document.getElementById("gender").value;

            const patientPhone =
                document.getElementById("phone").value.trim();

            const patientEmail =
                document.getElementById("email").value.trim();

            // Get existing patient records

            let patients = JSON.parse(
                localStorage.getItem("hospitalPatients") || "[]"
            );

            // Create new patient record

            const newPatient = {

                id: Date.now(),

                queueNumber: patients.length + 1,

                name: patientName,

                age: patientAge,

                gender: patientGender,

                phone: patientPhone,

                email: patientEmail,

                registrationDate: new Date().toLocaleDateString()

            };

            // Add patient to Queue (FIFO)

            patients.push(newPatient);

            // Save patient details in Local Storage

            localStorage.setItem(
                "hospitalPatients",
                JSON.stringify(patients)
            );

            // Show success message

            alert(
                "Patient Registered Successfully!\n" +
                "Patient Name: " + patientName + "\n" +
                "Queue Number: " + newPatient.queueNumber
            );

            // Clear form

            registerForm.reset();

        });

    </script>

</body>
</html>
